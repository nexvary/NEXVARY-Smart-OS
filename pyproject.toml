[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvary-smart-os"
version = "0.3.0"
description = "Independent OS preparation and Windows driver applications"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3"]

[project.optional-dependencies]
linux = ["pycdlib==1.14.0", "PyYAML>=6.0.2,<7", "tzdata>=2025.2"]
build = ["pyinstaller==6.12.0"]

[project.scripts]
smart-linux-installer = "smart_os.linux_app:main"
smart-windows-driver = "smart_os.windows_app:main"
smart-os = "smart_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smart_os.ui" = ["assets/*.ttf", "assets/*.txt"]
