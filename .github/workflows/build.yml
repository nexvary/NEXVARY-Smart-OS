name: Smart OS safety and independent desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 xvfb
      - run: python -m pip install ".[linux,build]"
      - run: python -m unittest discover -s tests -v
      - name: Windows read-only hardware and Driver Store smoke test
        if: runner.os == 'Windows'
        run: python scripts/windows-readonly-smoke.py
      - run: python scripts/build.py
      - name: Native bundle smoke checks (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/SmartLinuxInstaller/SmartLinuxInstaller --self-check
          dist/SmartWindowsDriver/SmartWindowsDriver --self-check
          QT_QPA_PLATFORM=xcb xvfb-run -a dist/SmartLinuxInstaller/SmartLinuxInstaller --self-check
      - name: Native bundle smoke checks (Windows)
        if: runner.os == 'Windows'
        run: |
          $a = Start-Process 'dist/SmartLinuxInstaller/SmartLinuxInstaller.exe' -ArgumentList '--self-check' -Wait -PassThru
          if ($a.ExitCode -ne 0) { throw 'Linux preparation app smoke check failed' }
          $b = Start-Process 'dist/SmartWindowsDriver/SmartWindowsDriver.exe' -ArgumentList '--self-check' -Wait -PassThru
          if ($b.ExitCode -ne 0) { throw 'Driver app smoke check failed' }
      - name: Build separate Windows installers
        if: runner.os == 'Windows'
        run: ./scripts/build-installers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SmartLinuxInstaller-${{ matrix.os }}
          path: dist/SmartLinuxInstaller/
      - uses: actions/upload-artifact@v4
        with:
          name: SmartWindowsDriver-${{ matrix.os }}
          path: dist/SmartWindowsDriver/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SmartOS-independent-Windows-Setup
          path: dist/setup/*.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SmartOS-Windows-readonly-verification
          path: artifacts/verification/windows-readonly.json
