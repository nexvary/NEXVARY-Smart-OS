name: Smart OS safety and independent desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 xvfb xauth libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-render0 libxcb-render-util0 libxcb-xkb1 libx11-xcb1 libsm6 libice6 libfontconfig1
      - run: python -m pip install ".[linux,build]"
      - run: python -m unittest discover -s tests -v
      - name: Windows read-only hardware and Driver Store smoke test
        if: runner.os == 'Windows'
        run: python scripts/windows-readonly-smoke.py
      - name: Real repair and component cleanup on disposable Windows runner
        if: runner.os == 'Windows'
        timeout-minutes: 60
        run: python scripts/windows-servicing-smoke.py
      - name: Capture real application UI
        run: python scripts/capture-ui.py --scan
      - run: python scripts/build.py
      - name: Native bundle smoke checks (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/SmartLinuxInstaller/SmartLinuxInstaller --self-check
          dist/SmartWindowsDriver/SmartWindowsDriver --self-check
          ldd dist/SmartLinuxInstaller/_internal/PySide6/Qt/plugins/platforms/libqxcb.so
          QT_QPA_PLATFORM=xcb xvfb-run -a dist/SmartLinuxInstaller/SmartLinuxInstaller --self-check
      - name: Native bundle smoke checks (Windows)
        if: runner.os == 'Windows'
        run: |
          $a = Start-Process 'dist/SmartLinuxInstaller/SmartLinuxInstaller.exe' -ArgumentList '--self-check' -Wait -PassThru
          if ($a.ExitCode -ne 0) { throw 'Linux preparation app smoke check failed' }
          $b = Start-Process 'dist/SmartWindowsDriver/SmartWindowsDriver.exe' -ArgumentList '--self-check' -Wait -PassThru
          if ($b.ExitCode -ne 0) { throw 'Driver app smoke check failed' }
          $c = Start-Process 'dist/SmartWindowsDriver/SmartWindowsDriver.exe' -ArgumentList '--privilege-self-check' -Wait -PassThru
          if ($c.ExitCode -ne 0) { throw 'Packaged privilege helper check failed' }
          $d = Start-Process 'dist/SmartWindowsDriver/SmartWindowsDriver.exe' -ArgumentList '--native-audit-self-check' -Wait -PassThru
          if ($d.ExitCode -ne 0) { throw 'Packaged driver audit check failed' }
      - name: Build separate Windows installers
        if: runner.os == 'Windows'
        run: ./scripts/build-installers.ps1
      - name: Verify Windows setup install, launch and uninstall
        if: runner.os == 'Windows'
        run: ./scripts/test-installers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SmartLinuxInstaller-${{ matrix.os }}
          path: dist/SmartLinuxInstaller/
      - uses: actions/upload-artifact@v4
        with:
          name: SmartWindowsDriver-${{ matrix.os }}
          path: dist/SmartWindowsDriver/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SmartOS-independent-Windows-Setup
          path: dist/setup/*.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SmartOS-Windows-readonly-verification
          path: artifacts/verification/windows-readonly.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: SmartOS-Windows-servicing-verification
          path: artifacts/verification/windows-servicing.json
      - uses: actions/upload-artifact@v4
        with:
          name: SmartOS-UI-${{ matrix.os }}
          path: docs/screenshots/*.png
